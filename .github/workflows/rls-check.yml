name: RLS regression check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rls-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athleteos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Run RLS isolation regression test
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node test_rls_regression.mjs
