name: RLS regression check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rls-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athleteos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Instance Supabase locale et jetable (Docker, fournie par le runner
      # GitHub) — rejoue TOUTES les migrations de supabase/migrations/ dans
      # l'ordre, à partir d'une base vide, à chaque run. La suite RLS ne
      # touche donc jamais la production (tâche 7, DoD "ne touchent pas la
      # production"). studio/imgproxy/mailpit/vector/logflare/edge-runtime
      # ne sont pas nécessaires pour des tests RLS/storage et sont exclus
      # pour accélérer le démarrage (noms de service confirmés par le CLI :
      # "Valid containers to exclude are: edge-runtime, gotrue, imgproxy,
      # kong, logflare, mailpit, postgres-meta, postgrest, realtime,
      # storage-api, studio, supavisor, vector").
      # --debug : sans ça, un échec de migration n'affiche que le SQL fautif,
      # jamais la raison Postgres réelle (vécu lors du 1er run de cette CI).
      - name: Start local Supabase (applique toutes les migrations)
        run: supabase start -x studio,imgproxy,mailpit,vector,logflare,edge-runtime --debug

      # Identifiants de l'instance locale — ce ne sont pas des secrets (clés
      # de démo fixes, base jetable détruite à la fin du job), donc pas
      # besoin des secrets GitHub SUPABASE_* utilisés avant cette tâche.
      # Le contenu est aussi affiché en clair dans les logs (ni sensible ni
      # utile à cacher) — sert à vérifier les noms de variables exacts que
      # le CLI produit, jamais confirmés faute de Docker local.
      - name: Export local Supabase credentials
        run: |
          echo "--- supabase status -o env ---"
          supabase status -o env
          echo "--- fin ---"
          supabase status -o env >> "$GITHUB_ENV"

      # Lancée deux fois de suite (tâche 7, vérification obligatoire) : la
      # suite crée/nettoie ses propres fixtures à chaque exécution, un
      # deuxième passage identique confirme qu'elle est déterministe et ne
      # laisse rien traîner en base d'un run à l'autre.
      - name: Run RLS isolation & authorization regression suite (1/2)
        run: node test_rls_regression.mjs

      - name: Run RLS isolation & authorization regression suite (2/2 — déterminisme)
        run: node test_rls_regression.mjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop
