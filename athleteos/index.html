<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Le zoom reste disponible : indispensable pour l’accessibilité mobile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Changement du titre pour lier ton nom au projet -->
    <title>AthleteOS — Samuel Muhadri</title>
    
    <!-- Optimisation de la description et ajout de l'auteur pour Google/IA -->
    <meta name="description" content="AthleteOS, une plateforme de suivi scientifique de la performance athlétique développée par Samuel Muhadri." />
    <meta name="author" content="Samuel Muhadri" />
    <meta name="google-site-verification" content="y2rnTie_HbDPmigKhdFRdVIq6ZjwvWDanyoHwPeD-OU" />
    
    <!-- Meta-données Open Graph pour que ton nom s'affiche proprement si tu partages le lien (sur LinkedIn, WhatsApp, etc.) -->
    <meta property="og:title" content="AthleteOS — Samuel Muhadri" />
    <meta property="og:description" content="Plateforme de suivi scientifique de la performance athlétique." />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#07120C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AthleteOS" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fond sombre appliqué avant même le chargement de index.css — sans
         ça l'écran flashe en blanc (fond par défaut du navigateur) pendant
         une fraction de seconde à chaque lancement, surtout perceptible en
         PWA installée ou sur connexion lente. -->
    <style>html,body{background:#07120C}</style>

    <!-- Google Fonts : DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
