<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">AthleteOS — quatre directions de logo</title>
  <desc id="board-desc">Comparaison de quatre symboles AthleteOS : Orbit AO, Lane, Signal et Apex.</desc>
  <defs>
    <linearGradient id="board-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120C"/>
      <stop offset="0.55" stop-color="#0A1810"/>
      <stop offset="1" stop-color="#050D08"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#183424"/>
      <stop offset="1" stop-color="#0E1E15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>

    <symbol id="orbit" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 16A23 23 0 1 0 54 32"/>
        <path d="M19 45 31.2 17.2c.4-.9 1.7-.9 2.1 0L46 45M25 35h15"/>
      </g>
    </symbol>
    <symbol id="lane" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 48c11 0 16-5 18-15 2-11 8-17 22-20"/>
        <path d="M11 35c7 0 10-3 12-11 2-8 7-13 16-16"/>
        <path d="m43 9 9 3-5 8"/>
      </g>
    </symbol>
    <symbol id="signal" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 17c-10 8-10 22 0 30M44 13c14 10 14 28 0 38"/>
        <path d="m24 39 8-20 8 20-8 9Z"/>
      </g>
    </symbol>
    <symbol id="apex" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 48 28 14h10L21 48Z"/>
        <path d="m31 48 14-27h9L40 48Z"/>
      </g>
    </symbol>
  </defs>

  <rect width="1600" height="1120" fill="url(#board-bg)"/>
  <circle cx="170" cy="-40" r="330" fill="#24A87D" opacity=".055"/>
  <circle cx="1510" cy="1060" r="390" fill="#6B9FF2" opacity=".035"/>

  <g font-family="DM Sans, Inter, Arial, sans-serif">
    <text x="80" y="78" fill="#8D9C92" font-size="18" font-weight="600" letter-spacing="3">ATHLETEOS · BRAND STUDY 01</text>
    <text x="80" y="132" fill="#F2F7F4" font-size="44" font-weight="700" letter-spacing="-1.5">Quatre directions. Une identité.</text>
    <text x="80" y="169" fill="#B8C5BD" font-size="20">Symboles propriétaires · mouvement, signal et performance · sélection avant intégration</text>
    <g transform="translate(1360 65)" color="#43C99B">
      <use href="#orbit" width="80" height="80"/>
    </g>

    <!-- Card A -->
    <g transform="translate(80 220)" filter="url(#shadow)">
      <rect width="700" height="380" rx="28" fill="#0E1E15" stroke="#43C99B" stroke-opacity=".38"/>
      <rect x="28" y="28" width="58" height="32" rx="16" fill="#24A87D" fill-opacity=".13"/>
      <text x="57" y="50" text-anchor="middle" fill="#43C99B" font-size="15" font-weight="700">A</text>
      <text x="104" y="52" fill="#F2F7F4" font-size="22" font-weight="650">Orbit AO</text>
      <text x="28" y="86" fill="#8D9C92" font-size="15">Monogramme · système · progression continue</text>
      <rect x="28" y="116" width="176" height="176" rx="42" fill="url(#tile)" stroke="#24A87D" stroke-opacity=".18"/>
      <g transform="translate(58 146)" color="#43C99B"><use href="#orbit" width="116" height="116"/></g>
      <text x="238" y="170" fill="#F2F7F4" font-size="31" font-weight="650" letter-spacing="-1.2">Athlete<tspan fill="#43C99B">OS</tspan></text>
      <text x="238" y="201" fill="#B8C5BD" font-size="15">Le produit et l’athlète dans un même signe.</text>
      <g transform="translate(238 226)">
        <rect width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(10 10)" color="#43C99B"><use href="#orbit" width="32" height="32"/></g>
        <rect x="64" width="52" height="52" rx="14" fill="#F2F7F4"/><g transform="translate(74 10)" color="#07120C"><use href="#orbit" width="32" height="32"/></g>
        <rect x="128" width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(138 10)" color="#F2F7F4"><use href="#orbit" width="32" height="32"/></g>
      </g>
      <g transform="translate(28 322)" color="#43C99B">
        <use href="#orbit" width="16" height="16"/><use href="#orbit" x="42" y="-4" width="24" height="24"/><use href="#orbit" x="90" y="-8" width="32" height="32"/><use href="#orbit" x="146" y="-16" width="48" height="48"/>
      </g>
      <text x="238" y="342" fill="#8D9C92" font-size="14">16 · 24 · 32 · 48 px</text>
    </g>

    <!-- Card B -->
    <g transform="translate(820 220)" filter="url(#shadow)">
      <rect width="700" height="380" rx="28" fill="#0E1E15" stroke="#EBF7EF" stroke-opacity=".11"/>
      <rect x="28" y="28" width="58" height="32" rx="16" fill="#6B9FF2" fill-opacity=".13"/>
      <text x="57" y="50" text-anchor="middle" fill="#8DBDFA" font-size="15" font-weight="700">B</text>
      <text x="104" y="52" fill="#F2F7F4" font-size="22" font-weight="650">Lane</text>
      <text x="28" y="86" fill="#8D9C92" font-size="15">Trajectoire · impulsion · accélération</text>
      <rect x="28" y="116" width="176" height="176" rx="42" fill="url(#tile)" stroke="#6B9FF2" stroke-opacity=".18"/>
      <g transform="translate(58 146)" color="#6B9FF2"><use href="#lane" width="116" height="116"/></g>
      <text x="238" y="170" fill="#F2F7F4" font-size="31" font-weight="650" letter-spacing="-1.2">Athlete<tspan fill="#6B9FF2">OS</tspan></text>
      <text x="238" y="201" fill="#B8C5BD" font-size="15">La piste suggérée par le mouvement, jamais dessinée.</text>
      <g transform="translate(238 226)">
        <rect width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(10 10)" color="#6B9FF2"><use href="#lane" width="32" height="32"/></g>
        <rect x="64" width="52" height="52" rx="14" fill="#F2F7F4"/><g transform="translate(74 10)" color="#07120C"><use href="#lane" width="32" height="32"/></g>
        <rect x="128" width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(138 10)" color="#F2F7F4"><use href="#lane" width="32" height="32"/></g>
      </g>
      <g transform="translate(28 322)" color="#6B9FF2">
        <use href="#lane" width="16" height="16"/><use href="#lane" x="42" y="-4" width="24" height="24"/><use href="#lane" x="90" y="-8" width="32" height="32"/><use href="#lane" x="146" y="-16" width="48" height="48"/>
      </g>
      <text x="238" y="342" fill="#8D9C92" font-size="14">16 · 24 · 32 · 48 px</text>
    </g>

    <!-- Card C -->
    <g transform="translate(80 640)" filter="url(#shadow)">
      <rect width="700" height="380" rx="28" fill="#0E1E15" stroke="#EBF7EF" stroke-opacity=".11"/>
      <rect x="28" y="28" width="58" height="32" rx="16" fill="#9B84F0" fill-opacity=".13"/>
      <text x="57" y="50" text-anchor="middle" fill="#B8A8FF" font-size="15" font-weight="700">C</text>
      <text x="104" y="52" fill="#F2F7F4" font-size="22" font-weight="650">Signal</text>
      <text x="28" y="86" fill="#8D9C92" font-size="15">Mesure · compréhension · décision</text>
      <rect x="28" y="116" width="176" height="176" rx="42" fill="url(#tile)" stroke="#9B84F0" stroke-opacity=".18"/>
      <g transform="translate(58 146)" color="#9B84F0"><use href="#signal" width="116" height="116"/></g>
      <text x="238" y="170" fill="#F2F7F4" font-size="31" font-weight="650" letter-spacing="-1.2">Athlete<tspan fill="#9B84F0">OS</tspan></text>
      <text x="238" y="201" fill="#B8C5BD" font-size="15">Une donnée vivante transformée en signal utile.</text>
      <g transform="translate(238 226)">
        <rect width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(10 10)" color="#9B84F0"><use href="#signal" width="32" height="32"/></g>
        <rect x="64" width="52" height="52" rx="14" fill="#F2F7F4"/><g transform="translate(74 10)" color="#07120C"><use href="#signal" width="32" height="32"/></g>
        <rect x="128" width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(138 10)" color="#F2F7F4"><use href="#signal" width="32" height="32"/></g>
      </g>
      <g transform="translate(28 322)" color="#9B84F0">
        <use href="#signal" width="16" height="16"/><use href="#signal" x="42" y="-4" width="24" height="24"/><use href="#signal" x="90" y="-8" width="32" height="32"/><use href="#signal" x="146" y="-16" width="48" height="48"/>
      </g>
      <text x="238" y="342" fill="#8D9C92" font-size="14">16 · 24 · 32 · 48 px</text>
    </g>

    <!-- Card D -->
    <g transform="translate(820 640)" filter="url(#shadow)">
      <rect width="700" height="380" rx="28" fill="#0E1E15" stroke="#EBF7EF" stroke-opacity=".11"/>
      <rect x="28" y="28" width="58" height="32" rx="16" fill="#F0B44D" fill-opacity=".13"/>
      <text x="57" y="50" text-anchor="middle" fill="#F0B44D" font-size="15" font-weight="700">D</text>
      <text x="104" y="52" fill="#F2F7F4" font-size="22" font-weight="650">Apex</text>
      <text x="28" y="86" fill="#8D9C92" font-size="15">Structure · sommet · maîtrise</text>
      <rect x="28" y="116" width="176" height="176" rx="42" fill="url(#tile)" stroke="#F0B44D" stroke-opacity=".18"/>
      <g transform="translate(58 146)" color="#F0B44D"><use href="#apex" width="116" height="116"/></g>
      <text x="238" y="170" fill="#F2F7F4" font-size="31" font-weight="650" letter-spacing="-1.2">Athlete<tspan fill="#F0B44D">OS</tspan></text>
      <text x="238" y="201" fill="#B8C5BD" font-size="15">Une construction nette qui progresse vers le sommet.</text>
      <g transform="translate(238 226)">
        <rect width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(10 10)" color="#F0B44D"><use href="#apex" width="32" height="32"/></g>
        <rect x="64" width="52" height="52" rx="14" fill="#F2F7F4"/><g transform="translate(74 10)" color="#07120C"><use href="#apex" width="32" height="32"/></g>
        <rect x="128" width="52" height="52" rx="14" fill="#14281C"/><g transform="translate(138 10)" color="#F2F7F4"><use href="#apex" width="32" height="32"/></g>
      </g>
      <g transform="translate(28 322)" color="#F0B44D">
        <use href="#apex" width="16" height="16"/><use href="#apex" x="42" y="-4" width="24" height="24"/><use href="#apex" x="90" y="-8" width="32" height="32"/><use href="#apex" x="146" y="-16" width="48" height="48"/>
      </g>
      <text x="238" y="342" fill="#8D9C92" font-size="14">16 · 24 · 32 · 48 px</text>
    </g>

    <text x="80" y="1072" fill="#8D9C92" font-size="15">Direction A sélectionnée · symbole final partagé par l’interface, le favicon et les assets PWA</text>
    <text x="1520" y="1072" text-anchor="end" fill="#43C99B" font-size="15" font-weight="650">ATHLETEOS · 2026</text>
  </g>
</svg>
